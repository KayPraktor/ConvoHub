# Tests on Windows and macOS, and builds the macOS app (ConvoHub-mac-arm64.dmg) on GitHub's Apple Silicon machines.
# The Windows installer is still built by hand with packaging/build.ps1 (it needs Inno Setup).
#   - every push to main / mac-build and every pull request: tests + DMG (downloadable from the run's artifacts)
#   - a tag v*: the same, then the DMG is attached to that tag's GitHub release (created as a draft if missing)
name: build

on:
  push:
    branches: [main, mac-build]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  UV_PYTHON: "3.14"  # the Python the app is built and tested with
  PYTHONUTF8: "1"

jobs:
  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Install packages
        run: uv sync
      - name: Run tests
        run: uv run pytest -q

  # Runs next to the tests (not after them) so the DMG is built even if a Windows test is flaky.
  mac-app:
    name: macOS app (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Build ConvoHub.app and the DMG
        run: bash packaging/build_mac.sh

      - name: Check the signature
        run: |
          codesign --verify --deep --strict --verbose=2 dist/ConvoHub.app
          codesign --display --verbose=2 dist/ConvoHub.app

      - name: Check the DMG and install the app from it
        run: |
          set -euo pipefail
          DMG=packaging/Output/ConvoHub-mac-arm64.dmg
          MNT="$RUNNER_TEMP/dmg"
          mkdir -p "$MNT"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT"
          trap 'hdiutil detach "$MNT" || hdiutil detach -force "$MNT"' EXIT
          ls -la "$MNT"
          test -d "$MNT/ConvoHub.app"
          test -L "$MNT/Applications"
          test "$(readlink "$MNT/Applications")" = /Applications
          codesign --verify --deep --strict --verbose=2 "$MNT/ConvoHub.app"
          # "Install" it the way a user would (copy it out of the DMG); the smoke test runs this copy.
          mkdir -p "$RUNNER_TEMP/installed"
          ditto "$MNT/ConvoHub.app" "$RUNNER_TEMP/installed/ConvoHub.app"

      - name: Smoke test the installed app
        env:
          CONVOHUB_DATA_DIR: ${{ runner.temp }}/chdata
          CONVOHUB_PORT: "28799"
        run: uv run --no-sync python packaging/smoke_test_mac.py "$RUNNER_TEMP/installed/ConvoHub.app"

      - name: Upload the DMG
        uses: actions/upload-artifact@v7
        with:
          name: ConvoHub-mac-arm64
          path: packaging/Output/ConvoHub-mac-arm64.dmg
          if-no-files-found: error
          compression-level: 0  # a DMG is already compressed

      - name: Upload the server log (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-logs
          path: ${{ runner.temp }}/chdata/*.log
          if-no-files-found: ignore

  # Only for tags, and only when the tests on both systems and the macOS build passed.
  release:
    name: attach the DMG to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, mac-app]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ConvoHub-mac-arm64
          path: out
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "ConvoHub ${TAG#v}" \
              --notes "Draft created by the build workflow. ConvoHub-mac-arm64.dmg is attached; add ConvoHub-Setup.exe and the notes, then publish."
          fi
          gh release upload "$TAG" out/ConvoHub-mac-arm64.dmg --clobber
