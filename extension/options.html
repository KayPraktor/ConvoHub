<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>ConvoHub</title>
  <style>
    body { font: 14px Vazirmatn, Tahoma, sans-serif; margin: 16px; min-width: 360px; line-height: 1.8; }
    label { display: block; margin: 10px 0; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 4px 8px; direction: ltr; }
    button { padding: 4px 14px; margin-inline-end: 6px; }
    .hint { color: #6b7280; font-size: 12px; }
    #msg { margin-top: 8px; }
  </style>
</head>
<body>
  <!-- Texts come from i18n.js (data-i18n keys) in the ConvoHub app's language; the English here is only a placeholder. -->
  <h3>ConvoHub</h3>
  <label><span data-i18n="optServer">ConvoHub address</span>
    <input id="server" type="text" placeholder="http://127.0.0.1:28765">
  </label>
  <label><input id="auto" type="checkbox"> <span data-i18n="optAuto">Automatically add new messages to chats I've already sent</span></label>
  <div class="hint" data-i18n="optHint"></div>
  <div>
    <button id="save" data-i18n="optSave">Save</button>
    <button id="test" data-i18n="optTest">Test connection</button>
  </div>
  <div id="msg"></div>
  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
