[project]
name = "convohub"
version = "0.1.0"
description = "Personal, local-first library of AI chat conversations, with chat via OpenRouter."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    "playwright>=1.48",
    "fastmcp>=4.1.6",
    "send2trash>=2.1.0",
]

[dependency-groups]
build = [
    "pyinstaller>=6.16",
]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
